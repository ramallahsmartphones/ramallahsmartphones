<html lang="ar" dir="rtl">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دفتر الأقساط</title>

<meta name="theme-color" content="#16283f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر الأقساط">

<link rel="icon" href="icons/icon-192.png">

<style>
  :root{
    --ink:#1c2430; --paper:#f6f3ec; --paper-raised:#fffdf8;
    --navy:#16283f; --navy-soft:#20395a; --brass:#b8934a; --brass-soft:#e7d4a6;
    --line:#ddd3ba; --ok:#3f7d58; --ok-bg:#e7f1ea; --warn:#b3792e; --warn-bg:#faf0dd;
    --bad:#a5453f; --bad-bg:#f7e7e5; --muted:#6d7789;
    --shadow: 0 1px 2px rgba(28,36,48,.06), 0 6px 20px -8px rgba(28,36,48,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Tajawal',sans-serif;min-height:100vh;}
  h1,h2,h3,.brand,.tabbtn,.badge,button{font-family:'Cairo',sans-serif;}
  .app{max-width:1220px;margin:0 auto;padding:18px 18px 60px;}

  .topbar{
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-soft) 100%);
    border-radius:16px;padding:20px 24px;color:#f3ede0;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .topbar::after{content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(135deg, rgba(184,147,74,.08) 0 2px, transparent 2px 26px);
    pointer-events:none;}
  .brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .brand-mark{width:42px;height:42px;border-radius:10px;background:var(--brass);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:none;}
  .brand-text h1{margin:0;font-size:20px;font-weight:800;}
  .brand-text span{font-size:12.5px;color:var(--brass-soft);}
  .headline-stats{display:flex;gap:22px;position:relative;z-index:1;flex-wrap:wrap;}
  .hstat{text-align:center;}
  .hstat b{display:block;font-size:18px;font-weight:800;}
  .hstat small{color:var(--brass-soft);font-size:11.5px;}
  .save-warning{
    background:var(--warn-bg); color:var(--warn); border:1px solid #e6c98a;
    border-radius:10px; padding:9px 14px; font-size:12.5px; font-weight:700;
    margin-top:10px; text-align:center;
  }

  .tabs{display:flex;gap:8px;margin:20px 0 18px;flex-wrap:wrap;}
  .tabbtn{border:1px solid var(--line);background:var(--paper-raised);color:var(--muted);
    padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;}
  .tabbtn:hover{border-color:var(--brass);color:var(--ink);}
  .tabbtn.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .card-head h2{margin:0;font-size:16.5px;font-weight:800;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  input[type=text],input[type=number],input[type=date],select,textarea{
    font-family:'Tajawal',sans-serif;border:1px solid var(--line);background:#fff;border-radius:9px;
    padding:9px 11px;font-size:14px;color:var(--ink);outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(184,147,74,.18);}
  label{font-size:12.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px;}
  .field{display:flex;flex-direction:column;min-width:130px;}
  .field.grow{flex:1;}

  button.btn{border:none;cursor:pointer;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:700;transition:.15s;}
  .btn-primary{background:var(--brass);color:var(--navy);}
  .btn-primary:hover{background:#a67f3d;}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--line)!important;color:var(--ink);}
  .btn-ghost:hover{border-color:var(--brass)!important;}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px;}
  .icon-btn{background:none;border:none;cursor:pointer;padding:5px;border-radius:7px;color:var(--muted);}
  .icon-btn:hover{background:var(--paper);color:var(--ink);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:right;color:var(--muted);font-weight:700;font-size:12px;padding:8px 10px;
    border-bottom:2px solid var(--line);white-space:nowrap;}
  tbody td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
  tbody tr:hover{background:#fbf8f0;}
  .num{font-variant-numeric:tabular-nums;font-weight:600;}
  .debit{color:var(--bad);} .credit{color:var(--ok);} .muted{color:var(--muted);}
  .name-cell{font-weight:700;white-space:normal;}
  .table-wrap{overflow-x:auto;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-bad{background:var(--bad-bg);color:var(--bad);}
  .badge-muted{background:#ece7d9;color:var(--muted);}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;}

  .overlay{position:fixed;inset:0;background:rgba(22,29,40,.55);display:flex;align-items:center;
    justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--paper-raised);border-radius:16px;padding:22px;width:100%;max-width:560px;
    max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .modal h3{margin:0 0 16px;font-size:17px;font-weight:800;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){.grid2{grid-template-columns:1fr;}}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);
    z-index:80;opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .filter-chip{border:1px solid var(--line);background:#fff;color:var(--muted);padding:7px 14px;
    border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .filter-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .filter-chip .cnt{opacity:.75;margin-inline-start:4px;}

  .customer-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;
    background:#fff;position:relative;}
  .customer-card::before{content:"";position:absolute;top:0;bottom:0;right:0;width:5px;border-radius:0 12px 12px 0;background:var(--brass);}
  .customer-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .customer-name{font-weight:800;font-size:15px;}
  .customer-phone{color:var(--muted);font-size:12.5px;}
  .cstats{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap;}
  .cstat b{display:block;font-size:15px;} .cstat small{color:var(--muted);font-size:11px;}
  .doubt-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;}

  .modrow-changed{background:#fbf3e2;}
  .app-loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);font-size:14px;}
  .auth-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:32px 28px;width:100%;max-width:380px;}
  .auth-card .brand-mark{width:52px;height:52px;border-radius:12px;background:var(--brass);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;}
  .auth-card h1{font-size:19px;}
  .auth-card input{width:100%;}
  ::placeholder{color:#a9a290;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
</style>
</head>

      'auth/missing-password': 'الرجاء إدخال كلمة المرور',
    };
    return map[code] || ('حدث خطأ: ' + code);
  }

          </p>
          ${mode==='login' ? '<p class="hint" style="text-align:center;margin-top:4px"><a href="#" id="forgotPass" style="color:var(--muted);text-decoration:underline">نسيت كلمة المرور؟</a></p>' : ''}
        </div>
      </div>
    `;
    document.getElementById("switchMode").addEventListener("click",(e)=>{ e.preventDefault(); renderAuthGate(mode==='signup'?'login':'signup'); });

  function attachFirestoreListener(uid){
    if(firestoreUnsub) firestoreUnsub();
    const docRef = db.collection('ledgers').doc(uid);
    firestoreUnsub = docRef.onSnapshot((snap) => {
      if(snap.exists){
        const data = snap.data();
        state.customers = data.customers || [];
        state.purchases = data.purchases || [];
        state.payments = data.payments || [];
        state.settings = Object.assign({overdueDays:45, currency:"₪"}, data.settings || {});
        ready = true;
        saveStatus = 'ok';
        render();
      } else {
        ready = true;
        offerLocalDataImportThenSave();
      }
    }, (err) => {
      console.error(err);
      saveStatus = 'error';
      ready = true;
      render();
    });
  }

  function offerLocalDataImportThenSave(){
    // brand-new account: offer to import any data previously stored on this device/browser
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        const has = (parsed.customers&&parsed.customers.length) || (parsed.purchases&&parsed.purchases.length) || (parsed.payments&&parsed.payments.length);
        if(has && confirm('وجدنا بيانات محفوظة سابقاً على هذا الجهاز، هل تريد استيرادها لهذا الحساب الجديد؟')){
          state.customers = parsed.customers || [];
          state.purchases = parsed.purchases || [];
          state.payments = parsed.payments || [];
          state.settings = Object.assign({overdueDays:45, currency:"₪"}, parsed.settings || {});
        }
      }
    }catch(e){ /* ignore */ }
    saveData();
    render();
  }

  fbAuth.onAuthStateChanged((user) => {
    if(user){
      attachFirestoreListener(user.uid);
    } else {
      if(firestoreUnsub){ firestoreUnsub(); firestoreUnsub = null; }
      ready = false;
      renderAuthGate('login');
    }
  });

  const appEl = document.getElementById("app");
  const toastEl = document.getElementById("toast");

  function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"), 2200); }
  function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(d){ if(!d) return "—"; const dt=new Date(d); if(isNaN(dt)) return "—";
    return dt.toLocaleDateString('ar-EG', {year:'numeric', month:'2-digit', day:'2-digit'}); }
  function fmtDateTime(d){ if(!d) return "—"; const dt=new Date(d); if(isNaN(dt)) return "—";
    return dt.toLocaleDateString('ar-EG', {year:'numeric', month:'2-digit', day:'2-digit'}) + ' ' + dt.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}); }
  function num(n){ n = Number(n)||0; return n.toLocaleString('en-US', {maximumFractionDigits:2}); }
  function money(n){ return num(n) + ' ' + state.settings.currency; }
  function daysSince(dateStr){ if(!dateStr) return Infinity; const d=new Date(dateStr); if(isNaN(d)) return Infinity;
    return Math.floor((Date.now()-d.getTime())/86400000); }

  // ---------- storage ----------
  // This version stores everything in Firestore, tied to your account (fbAuth.currentUser).
  // Real-time updates arrive automatically via attachFirestoreListener()'s onSnapshot above.
  async function saveData(){
    const user = fbAuth.currentUser;
    if(!user) return;
    try{
      await db.collection('ledgers').doc(user.uid).set({
        customers: state.customers,
        purchases: state.purchases,
        payments: state.payments,
        settings: state.settings,
      });
      if(saveStatus !== 'ok'){ saveStatus = 'ok'; render(); }
    }catch(e){
      console.error(e);
      if(saveStatus !== 'error'){ saveStatus = 'error'; render(); }
    }
  }

  // ---------- customer lookups ----------
  function findCustomer(name){
    const key = (name||"").trim();
    return state.customers.find(c => c.name === key);
  }
  function ensureCustomerExists(name, phone){
    const key = (name||"").trim();
    if(!key) return;
    let c = findCustomer(key);
    if(!c){
      c = { id: uid('cus'), name:key, phone: phone||"", address:"", notes:"", doubtful:false,
            createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
      state.customers.push(c);
    } else if(phone && !c.phone){
      c.phone = phone; c.updatedAt = new Date().toISOString();
    }
  }
  function allCustomerNames(){
    const names = new Set(state.customers.map(c=>c.name));
    state.purchases.forEach(p=>names.add(p.customerName));
    state.payments.forEach(p=>names.add(p.customerName));
    return Array.from(names).filter(Boolean).sort();
  }

  // ---------- derived accounts ----------
  function computeAccounts(){
    const map = new Map();
    function get(name){
      const key = (name||"").trim() || "(بدون اسم)";
      if(!map.has(key)){
        const cust = findCustomer(key);
        map.set(key, {
          name:key, phone: cust?cust.phone:"", address: cust?cust.address:"", notes: cust?cust.notes:"",
          doubtful: cust?!!cust.doubtful:false,
          totalDebit:0, totalCredit:0, totalProfit:0,
          firstPurchase:null, lastActivity:null, lastPayment:null, purCount:0, payCount:0
        });
      }
      return map.get(key);
    }
    for(const p of state.purchases){
      const c = get(p.customerName);
      c.totalDebit += Number(p.price)||0;
      c.totalProfit += Number(p.profit)||0;
      c.purCount++;
      if(!c.firstPurchase || new Date(p.date) < new Date(c.firstPurchase)) c.firstPurchase = p.date;
      if(!c.lastActivity || new Date(p.date) > new Date(c.lastActivity)) c.lastActivity = p.date;
    }
    for(const p of state.payments){
      const c = get(p.customerName);
      c.totalCredit += Number(p.amount)||0;
      c.payCount++;
      if(!c.lastPayment || new Date(p.date) > new Date(c.lastPayment)) c.lastPayment = p.date;
      if(!c.lastActivity || new Date(p.date) > new Date(c.lastActivity)) c.lastActivity = p.date;
    }
    // include customers with zero activity too
    state.customers.forEach(cust => get(cust.name));
    const list = Array.from(map.values()).map(c=>{
      c.balance = c.totalDebit - c.totalCredit;
      c.collectedProfit = c.totalDebit > 0 ? c.totalProfit * Math.min(1, c.totalCredit/c.totalDebit) : 0;
      c.overdue = c.balance > 0.009 && daysSince(c.lastActivity) > (state.settings.overdueDays||45);
      c.paidOff = c.balance <= 0.009 && c.totalDebit > 0;
      c.hasPending = c.balance > 0.009;
      return c;
    });
    list.sort((a,b)=>(b.lastActivity||"").localeCompare(a.lastActivity||""));
    return list;
  }

  function datalistNames(id){
    return `<datalist id="${id}">${allCustomerNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;
  }

  // ---------- render shell ----------
  function render(){
    if(!ready){ appEl.innerHTML = '<div class="app-loading">جارِ التحميل…</div>'; return; }

    // remember focus + cursor position so re-rendering doesn't kick the user out of a text field
    const active = document.activeElement;
    const activeId = active && active.id;
    const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

    const accounts = computeAccounts();
    const totalDue = accounts.reduce((s,c)=>s+Math.max(0,c.balance),0);
    const totalProfit = accounts.reduce((s,c)=>s+c.totalProfit,0);

    appEl.innerHTML = `
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">أ</div>
          <div class="brand-text"><h1>دفتر الأقساط</h1><span>متابعة مبيعات الأجهزة والتحصيل</span></div>
        </div>
        <div class="headline-stats">
          <div class="hstat"><b>${money(totalDue)}</b><small>مستحق حالياً</small></div>
          <div class="hstat"><b>${money(totalProfit)}</b><small>إجمالي الربح</small></div>
          <div class="hstat"><b>${accounts.length}</b><small>عدد العملاء</small></div>
        </div>
      </div>
      ${saveStatus==='error' ? `
      <div class="save-warning">⚠️ تعذر الاتصال بقاعدة البيانات — تحقق من اتصال الإنترنت. تعديلاتك محفوظة مؤقتاً في هذا الجهاز وستتزامن تلقائياً عند عودة الاتصال</div>
      ` : ''}
      <div class="tabs">
        <button class="tabbtn ${currentTab==='customers'?'active':''}" data-tab="customers">معلومات العملاء</button>
        <button class="tabbtn ${currentTab==='purchases'?'active':''}" data-tab="purchases">المشتريات</button>
        <button class="tabbtn ${currentTab==='payments'?'active':''}" data-tab="payments">المدفوعات</button>
        <button class="tabbtn ${currentTab==='statements'?'active':''}" data-tab="statements">كشوف الحسابات</button>
        <button class="tabbtn ${currentTab==='modifications'?'active':''}" data-tab="modifications">تقرير التعديلات</button>
        <button class="tabbtn ${currentTab==='settings'?'active':''}" data-tab="settings">الإعدادات</button>
      </div>
      <div id="tabContent"></div>
    `;
    document.querySelectorAll(".tabbtn").forEach(b=>b.addEventListener("click", ()=>{ currentTab=b.dataset.tab; render(); }));

    const content = document.getElementById("tabContent");
    if(currentTab==="customers") content.innerHTML = renderCustomersInfo();
    else if(currentTab==="purchases") content.innerHTML = renderPurchases();
    else if(currentTab==="payments") content.innerHTML = renderPayments();
    else if(currentTab==="statements") content.innerHTML = renderStatements(accounts);
    else if(currentTab==="modifications") content.innerHTML = renderModifications();
    else content.innerHTML = renderSettings();

    bindEvents(accounts);

    // restore focus + cursor position (e.g. search boxes) after the re-render above
    if(activeId){
      const el = document.getElementById(activeId);
      if(el && typeof el.focus === 'function'){
        el.focus();
        if(selStart !== null && typeof el.setSelectionRange === 'function'){
          try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
        }
      }
    }
  }

  }

  function deleteCustomer(id){
    const c = state.customers.find(x=>x.id===id);
    if(!c) return;
    const hasRecords = state.purchases.some(p=>p.customerName===c.name) || state.payments.some(p=>p.customerName===c.name);
    const msg = hasRecords
      ? "هذا العميل لديه مشتريات أو دفعات مسجلة. سيتم حذف بياناته الشخصية فقط (سيبقى اسمه في السجلات). متابعة؟"
      : "هل تريد حذف هذا العميل؟";
    if(!confirm(msg)) return;
    state.customers = state.customers.filter(x=>x.id!==id);
    saveData(); showToast("تم حذف العميل"); render();
  }

          <div class="field grow"><label>اسم العميل *</label><input type="text" id="pf_name" list="customerNamesModalList" value="${editing?esc(editing.customerName):''}"></div>
          <div class="field"><label>تاريخ الشراء *</label><input type="date" id="pf_date" value="${editing?(editing.date||'').slice(0,10):new Date().toISOString().slice(0,10)}"></div>
          <div class="field grow"><label>اسم المنتج</label><input type="text" id="pf_product" value="${editing?esc(editing.productName):''}" placeholder="مثال: Redmi 13C 256"></div>
          <div class="field"><label>سعر البيع *</label><input type="number" id="pf_price" value="${editing&&editing.price?editing.price:''}"></div>
          <div class="field"><label>التكلفة</label><input type="number" id="pf_cost" value="${editing&&editing.cost?editing.cost:''}"></div>
          <div class="field"><label>الربح</label><input type="number" id="pf_profit" value="${editing&&editing.profit?editing.profit:''}"></div>
          <div class="field grow"><label>المورّد</label><input type="text" id="pf_supplier" value="${editing?esc(editing.supplier):''}"></div>
        </div>
        ${datalistNames('customerNamesModalList')}
        <div class="modal-actions">
          <button class="btn btn-ghost" id="cancelBtn">إلغاء</button>
          <button class="btn btn-primary" id="saveBtn">${editing?'حفظ التعديلات':'إضافة'}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    wrap.addEventListener("click",(e)=>{ if(e.target===wrap) document.body.removeChild(wrap); });
    document.getElementById("cancelBtn").addEventListener("click", ()=>document.body.removeChild(wrap));
    document.getElementById("saveBtn").addEventListener("click", ()=>{
      const name = document.getElementById("pf_name").value.trim();
      const price = parseFloat(document.getElementById("pf_price").value)||0;
      if(!name){ showToast("الرجاء إدخال اسم العميل"); return; }
      if(!price){ showToast("الرجاء إدخال سعر البيع"); return; }
      const now = new Date().toISOString();
      const data = {
        customerName:name, date: document.getElementById("pf_date").value || now.slice(0,10),
        productName: document.getElementById("pf_product").value.trim(), price,
        cost: parseFloat(document.getElementById("pf_cost").value)||0,
        profit: parseFloat(document.getElementById("pf_profit").value)||0,
        supplier: document.getElementById("pf_supplier").value.trim(),
      };
      ensureCustomerExists(name);
      if(editing){ Object.assign(editing, data, {updatedAt: now}); showToast("تم حفظ التعديلات"); }
      else { data.id=uid('pur'); data.createdAt=now; data.updatedAt=now; state.purchases.push(data); showToast("تمت إضافة عملية الشراء"); }
      saveData(); document.body.removeChild(wrap); render();
    });
  }

  // ---------- payments page ----------
  function renderPayments(){
    let list = state.payments.slice();
    const q = search.payments.trim().toLowerCase();
    if(q) list = list.filter(p => (p.customerName||"").toLowerCase().includes(q));
    list.sort((a,b)=> sortDesc ? (b.date||"").localeCompare(a.date||"") : (a.date||"").localeCompare(b.date||""));
    const totalAmount = list.reduce((s,p)=>s+(Number(p.amount)||0),0);
    return `
      <div class="card">
        <div class="card-head">
          <h2>المدفوعات</h2>
          <div class="row">
            <input type="text" id="searchPayments" placeholder="بحث باسم العميل" value="${esc(search.payments)}" style="min-width:230px">
            <button class="btn btn-ghost btn-sm" id="sortBtn">${sortDesc?'الأحدث أولاً ▾':'الأقدم أولاً ▴'}</button>
            <button class="btn btn-primary" id="addPaymentBtn">+ إضافة دفعة</button>
          </div>
        </div>
        <p class="hint">${list.length} دفعة · إجمالي المحصَّل ${money(totalAmount)}</p>
        ${list.length===0 ? emptyState('لا توجد دفعات مسجلة بعد','') : `
        <div class="table-wrap">
        <table>
          <thead><tr><th>العميل</th><th>تاريخ الدفعة</th><th>المبلغ الدائن</th><th>ملاحظات</th><th>تاريخ الإنشاء</th><th></th></tr></thead>
          <tbody>
            ${list.map(p=>`
              <tr>
                <td class="name-cell">${esc(p.customerName)}</td>
                <td class="muted">${fmtDate(p.date)}</td>
                <td class="num credit">${money(p.amount)}</td>
                <td class="muted" style="white-space:normal">${esc(p.notes)||'—'}</td>
                <td class="muted" style="font-size:12px">${fmtDateTime(p.createdAt)}</td>
                <td><button class="icon-btn" data-editpay="${p.id}" title="تعديل">✎</button>
                    <button class="icon-btn" data-delpay="${p.id}" title="حذف">✕</button></td>
              </tr>`).join('')}
          </tbody>
        </table></div>`}
      </div>
      ${datalistNames('customerNamesList')}
    `;
  }

  function openPaymentModal(id){
    const editing = id ? state.payments.find(p=>p.id===id) : null;
    const wrap = document.createElement("div");
    wrap.className = "overlay";
    wrap.innerHTML = `
      <div class="modal">
        <h3>${editing?'تعديل دفعة':'إضافة دفعة'}</h3>
        <div class="grid2">
          <div class="field grow"><label>اسم العميل *</label><input type="text" id="pyf_name" list="customerNamesModalList" value="${editing?esc(editing.customerName):''}"></div>
          <div class="field"><label>تاريخ الدفعة *</label><input type="date" id="pyf_date" value="${editing?(editing.date||'').slice(0,10):new Date().toISOString().slice(0,10)}"></div>
          <div class="field"><label>المبلغ الدائن *</label><input type="number" id="pyf_amount" value="${editing&&editing.amount?editing.amount:''}"></div>
          <div class="field grow"><label>ملاحظات</label><input type="text" id="pyf_notes" value="${editing?esc(editing.notes):''}"></div>
        </div>
        ${datalistNames('customerNamesModalList')}
        <div class="modal-actions">
          <button class="btn btn-ghost" id="cancelBtn">إلغاء</button>
          <button class="btn btn-primary" id="saveBtn">${editing?'حفظ التعديلات':'إضافة'}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    wrap.addEventListener("click",(e)=>{ if(e.target===wrap) document.body.removeChild(wrap); });
    document.getElementById("cancelBtn").addEventListener("click", ()=>document.body.removeChild(wrap));
    document.getElementById("saveBtn").addEventListener("click", ()=>{
      const name = document.getElementById("pyf_name").value.trim();
      const amount = parseFloat(document.getElementById("pyf_amount").value)||0;
      if(!name){ showToast("الرجاء إدخال اسم العميل"); return; }
      if(!amount){ showToast("الرجاء إدخال المبلغ"); return; }
      const now = new Date().toISOString();
      const data = { customerName:name, date: document.getElementById("pyf_date").value || now.slice(0,10), amount,
        notes: document.getElementById("pyf_notes").value.trim() };
      ensureCustomerExists(name);
      if(editing){ Object.assign(editing, data, {updatedAt: now}); showToast("تم حفظ التعديلات"); }
      else { data.id=uid('pay'); data.createdAt=now; data.updatedAt=now; state.payments.push(data); showToast("تمت إضافة الدفعة"); }
      saveData(); document.body.removeChild(wrap); render();
    });
  }

  // ---------- statements (account balances) ----------
  function renderStatements(accounts){
    let list = accounts.slice();
    const q = search.statements.trim().toLowerCase();
    if(q) list = list.filter(c => c.name.toLowerCase().includes(q) || (c.phone||"").includes(q));
    const counts = {
      all: accounts.length,
      pending: accounts.filter(c=>c.hasPending).length,
      paid: accounts.filter(c=>c.paidOff).length,
      overdue: accounts.filter(c=>c.overdue).length,
      doubtful: accounts.filter(c=>c.doubtful).length,
    };
    if(statFilter==='pending') list = list.filter(c=>c.hasPending);
    else if(statFilter==='paid') list = list.filter(c=>c.paidOff);
    else if(statFilter==='overdue') list = list.filter(c=>c.overdue);
    else if(statFilter==='doubtful') list = list.filter(c=>c.doubtful);
    return `
      <div class="card">
        <div class="card-head">
          <h2>كشوف حسابات العملاء</h2>
          <input type="text" id="searchStatements" placeholder="بحث بالاسم أو الهاتف" value="${esc(search.statements)}" style="min-width:220px">
        </div>
        <div class="row" style="margin-bottom:16px">
          ${filterChip('all','الكل',counts.all)}
          ${filterChip('pending','عليهم دفعات',counts.pending)}
          ${filterChip('paid','مسددون بالكامل',counts.paid)}
          ${filterChip('overdue','متأخرون',counts.overdue)}
          ${filterChip('doubtful','مشكوك في تحصيلهم',counts.doubtful)}
        </div>
        ${list.length===0?emptyState('لا يوجد عملاء ضمن هذا الفلتر',''):list.map(c=>customerCard(c)).join('')}
      </div>
    `;
  }
  function filterChip(key,label,count){ return `<button class="filter-chip ${statFilter===key?'active':''}" data-filter="${key}">${label} <span class="cnt">${count}</span></button>`; }
  function customerCard(c){
    let badge='';
    if(c.doubtful) badge='<span class="badge badge-bad">مشكوك في التحصيل</span>';
    else if(c.overdue) badge='<span class="badge badge-warn">متأخر</span>';
    else if(c.paidOff) badge='<span class="badge badge-ok">مسدد بالكامل</span>';
    else if(c.hasPending) badge='<span class="badge badge-muted">عليه دفعات</span>';
    return `
      <div class="customer-card">
        <div class="customer-top">
          <div><div class="customer-name">${esc(c.name)} ${badge}</div>
          <div class="customer-phone">${esc(c.phone)||'بدون رقم هاتف'} · ${c.purCount} شراء · ${c.payCount} دفعة</div></div>
          <label class="doubt-toggle"><input type="checkbox" data-doubtful="${esc(c.name)}" ${c.doubtful?'checked':''}> مشكوك في التحصيل</label>
        </div>
        <div class="cstats">
          <div class="cstat"><b>${money(Math.max(0,c.balance))}</b><small>المبلغ المستحق</small></div>
          <div class="cstat"><b>${fmtDate(c.firstPurchase)}</b><small>تاريخ الشراء</small></div>
          <div class="cstat"><b>${fmtDate(c.lastPayment)}</b><small>آخر دفعة</small></div>
          <div class="cstat"><b style="color:var(--brass)">${money(c.collectedProfit)}</b><small>الربح المحصل (تقديري)</small></div>
          <div class="cstat"><b class="muted">${money(c.totalProfit)}</b><small>الربح الإجمالي المتوقع</small></div>
        </div>
      </div>`;
  }

  // ---------- modifications report ----------
  function renderModifications(){
    const rows = [
      ...state.purchases.map(p=>({...p, kind:'شراء', amount:p.price})),
      ...state.payments.map(p=>({...p, kind:'دفعة', amount:p.amount})),
    ].sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
    return `
      <div class="card">
        <div class="card-head"><h2>تقرير تعديل الحركات</h2></div>
        <p class="hint">يعرض هذا التقرير جميع المشتريات والدفعات مع تاريخ إنشائها وآخر تعديل. الصفوف المظللة تم تعديلها بعد إنشائها.</p>
        ${rows.length===0?emptyState('لا توجد حركات',''):`
        <div class="table-wrap">
        <table>
          <thead><tr><th>النوع</th><th>العميل</th><th>المبلغ</th><th>تاريخ الحركة</th><th>تاريخ الإنشاء</th><th>آخر تعديل</th><th>الحالة</th></tr></thead>
          <tbody>
            ${rows.map(t=>{
              const edited = t.updatedAt && t.createdAt && (new Date(t.updatedAt)-new Date(t.createdAt) > 2000);
              return `<tr class="${edited?'modrow-changed':''}">
                <td>${t.kind}</td><td class="name-cell">${esc(t.customerName)}</td>
                <td class="num">${money(t.amount)}</td><td class="muted">${fmtDate(t.date)}</td>
                <td class="muted" style="font-size:12px">${fmtDateTime(t.createdAt)}</td>
                <td class="muted" style="font-size:12px">${fmtDateTime(t.updatedAt)}</td>
                <td>${edited?'<span class="badge badge-warn">معدّلة</span>':'<span class="badge badge-muted">بدون تعديل</span>'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`}
      </div>
    `;
  }

  // ---------- settings ----------
  function renderSettings(){
    return `
      <div class="card">
        <div class="card-head"><h2>الإعدادات</h2></div>
        <div class="grid2">
          <div class="field">
            <label>عدد الأيام لاعتبار العميل متأخراً</label>
            <input type="number" id="overdueDaysInput" value="${state.settings.overdueDays}" min="1">
            <div class="hint">إذا مرّت هذه المدة دون أي حركة وكان على العميل مبلغ مستحق، يُصنَّف كـ"متأخر".</div>
          </div>
          <div class="field"><label>رمز العملة</label><input type="text" id="currencyInput" value="${esc(state.settings.currency)}" maxlength="4"></div>
        </div>
        <div class="row" style="margin-top:16px"><button class="btn btn-primary" id="saveSettingsBtn">حفظ الإعدادات</button></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>الحساب</h2></div>
        <p class="hint">مسجّل دخول حالياً بالبريد: <b style="color:var(--ink)">${esc(fbAuth.currentUser?fbAuth.currentUser.email:'—')}</b></p>
        <p class="hint">بياناتك متزامنة تلقائياً مع هذا الحساب — يمكنك تسجيل الدخول به من أي جهاز أو متصفح وستجد نفس البيانات فوراً.</p>
        <div class="row">
          <button class="btn btn-ghost" id="resetPassBtn">إرسال رابط تغيير كلمة المرور لبريدي</button>
          <button class="btn btn-ghost" id="signOutBtn">تسجيل الخروج</button>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>نسخ احتياطي</h2></div>
        <p class="hint">تنزيل نسخة من كل بياناتك كملف JSON. ننصح بأخذ نسخة بشكل دوري كضمان إضافي، أو لنقل البيانات لجهاز آخر.</p>
        <div class="row"><button class="btn btn-ghost" id="exportBtn">تنزيل نسخة احتياطية</button></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>استيراد ذمم دفتر ٢٠٢٤ (تقسيط)</h2></div>
        <p class="hint">استيراد لمرة واحدة لجميع العملاء الذين بقي عليهم رصيد مستحق من صفحة "تقسيط" في ملف إكسل ٢٠٢٤
        (${SEED_TAQSEET_2024.length} حركة تخص 37 عميلاً، بإجمالي رصيد مستحق قدره تقريباً 68,999).</p>
        <div class="row">
          <button class="btn btn-primary" id="importTaqseetBtn" ${state.settings.importedTaqseet2024?'disabled':''}>
            ${state.settings.importedTaqseet2024?'تم الاستيراد مسبقاً ✓':'استيراد الآن'}
          </button>
        </div>
      </div>
    `;
  }

  function exportBackup(){
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="نسخة-احتياطية-الدفتر.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast("تم تنزيل النسخة الاحتياطية");
  }

  function importTaqseet2024(){
    if(state.settings.importedTaqseet2024) return;
    const now = new Date().toISOString();
    for(const row of SEED_TAQSEET_2024){
      ensureCustomerExists(row.buyerName, row.buyerPhone);
      if(Number(row.debit) > 0){
        state.purchases.push({ id: uid('pur'), customerName: row.buyerName, date: row.date,
          productName: row.deviceType||"", price: Number(row.debit)||0, cost: Number(row.cost)||0,
          profit: Number(row.profit)||0, supplier: row.supplier||"", createdAt: now, updatedAt: now });
      }
      if(Number(row.credit) > 0){
        state.payments.push({ id: uid('pay'), customerName: row.buyerName, date: row.date,
          amount: Number(row.credit)||0, createdAt: now, updatedAt: now });
      }
    }
    state.settings.importedTaqseet2024 = true;
    saveData(); showToast(`تم استيراد ${SEED_TAQSEET_2024.length} حركة`); render();
  }

  function emptyState(title, sub){ return `<div class="empty"><b>${esc(title)}</b>${sub?`<div>${esc(sub)}</div>`:''}</div>`; }

  // ---------- events ----------
  function bindEvents(accounts){
    if(currentTab==="customers"){
      document.getElementById("addCustomerBtn").addEventListener("click", ()=>openCustomerModal(null));
      document.getElementById("searchCustomers").addEventListener("input",(e)=>{ search.customers=e.target.value; render(); });
      document.querySelectorAll("[data-editcust]").forEach(b=>b.addEventListener("click",()=>openCustomerModal(b.dataset.editcust)));
      document.querySelectorAll("[data-delcust]").forEach(b=>b.addEventListener("click",()=>deleteCustomer(b.dataset.delcust)));
    } else if(currentTab==="purchases"){
      document.getElementById("addPurchaseBtn").addEventListener("click", ()=>openPurchaseModal(null));
      document.getElementById("searchPurchases").addEventListener("input",(e)=>{ search.purchases=e.target.value; render(); });
      document.getElementById("sortBtn").addEventListener("click", ()=>{ sortDesc=!sortDesc; render(); });
      document.querySelectorAll("[data-editpur]").forEach(b=>b.addEventListener("click",()=>openPurchaseModal(b.dataset.editpur)));
      document.querySelectorAll("[data-delpur]").forEach(b=>b.addEventListener("click",()=>{
        if(!confirm("هل تريد حذف عملية الشراء هذه؟")) return;
        state.purchases = state.purchases.filter(p=>p.id!==b.dataset.delpur); saveData(); showToast("تم الحذف"); render();
      }));
    } else if(currentTab==="payments"){
      document.getElementById("addPaymentBtn").addEventListener("click", ()=>openPaymentModal(null));
      document.getElementById("searchPayments").addEventListener("input",(e)=>{ search.payments=e.target.value; render(); });
      document.getElementById("sortBtn").addEventListener("click", ()=>{ sortDesc=!sortDesc; render(); });
      document.querySelectorAll("[data-editpay]").forEach(b=>b.addEventListener("click",()=>openPaymentModal(b.dataset.editpay)));
      document.querySelectorAll("[data-delpay]").forEach(b=>b.addEventListener("click",()=>{
        if(!confirm("هل تريد حذف هذه الدفعة؟")) return;
        state.payments = state.payments.filter(p=>p.id!==b.dataset.delpay); saveData(); showToast("تم الحذف"); render();
      }));
    } else if(currentTab==="statements"){
      document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{ statFilter=b.dataset.filter; render(); }));
      document.getElementById("searchStatements").addEventListener("input",(e)=>{ search.statements=e.target.value; render(); });
      document.querySelectorAll("[data-doubtful]").forEach(cb=>cb.addEventListener("change",(e)=>{
        const name = cb.dataset.doubtful;
        ensureCustomerExists(name);
        findCustomer(name).doubtful = e.target.checked;
        findCustomer(name).updatedAt = new Date().toISOString();
        saveData(); render();
      }));
    } else if(currentTab==="settings"){
      document.getElementById("saveSettingsBtn").addEventListener("click", ()=>{
        const days = parseInt(document.getElementById("overdueDaysInput").value,10);
        const cur = document.getElementById("currencyInput").value.trim() || "₪";
        state.settings.overdueDays = isNaN(days)?45:days;
        state.settings.currency = cur;
        saveData(); showToast("تم حفظ الإعدادات"); render();
      });
      document.getElementById("exportBtn").addEventListener("click", exportBackup);
      document.getElementById("resetPassBtn").addEventListener("click", ()=>{
        const email = fbAuth.currentUser && fbAuth.currentUser.email;
        if(!email) return;
        fbAuth.sendPasswordResetEmail(email)
          .then(()=>showToast("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك"))
          .catch(err=>showToast(translateAuthError(err.code)));
      });
      document.getElementById("signOutBtn").addEventListener("click", ()=>{
        if(confirm("هل تريد تسجيل الخروج؟")) fbAuth.signOut();
      });
      const importBtn = document.getElementById("importTaqseetBtn");
      if(importBtn && !state.settings.importedTaqseet2024) importBtn.addEventListener("click", importTaqseet2024);
    }
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
